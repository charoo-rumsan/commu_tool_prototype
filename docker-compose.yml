version: "3.9"

services:
  app:
    build: .
    container_name: header_qdrant_app
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    volumes:
      - ./app:/app
      - ./data:/tmp

  qdrant:
    image: qdrant/qdrant:v1.12.3
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
